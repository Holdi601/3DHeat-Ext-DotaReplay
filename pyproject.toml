[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-dota-replay"
version = "0.1.0"
description = "Dota 2 replays (.dem) into 3DHeat tables: every hero's track, what happened where, and everything else the replay holds, read with gem-dota"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["gem-dota>=0.14,<0.15", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-dota-replay = "heat3d_ext_dota_replay.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_dota_replay"]
