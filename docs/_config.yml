title: 3DHeat Dota Replay
description: Dota 2 replays (.dem) as tables for the 3DHeat viewer.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
search_enabled: true
heading_anchors: true
aux_links:
  "GitHub": "https://github.com/Holdi601/3DHeat-Ext-DotaReplay"
  "3DHeat": "https://holdi601.github.io/3DHeat/"
exclude:
  - "*.py"
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
